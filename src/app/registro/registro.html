<div class="registro-container">

  <!-- PANEL IZQUIERDO - GER IAPP -->

  <div class="branding-panel">

    <div class="branding-content">

      <!-- LOGO -->
      <div class="logo-gerIapp">

        <img
          src="/loginLogo.png"
          alt="GerIApp"
          class="logo-gerIapp-img"
        >

        <h2>GerIApp</h2>

      </div>


      <!-- LÍNEA DECORATIVA -->
      <div class="linea-decorativa"></div>


      <!-- MENSAJE -->
      <div class="branding-text">

        <h3>
          Personas que cuidan personas
        </h3>

        <p>
          Juntos por una mejor calidad de vida.
        </p>

      </div>

    </div>

  </div>


  <!-- =====================================================
       PANEL DERECHO - REGISTRO
       ===================================================== -->

  <div class="registro-panel">

    <div class="registro-card">

      <!-- ENCABEZADO -->
      <div class="registro-header">

        <h1>Crear cuenta</h1>

        <p class="subtitulo">
          Regístrate para comenzar a utilizar GerIApp
        </p>

      </div>


      <!-- =================================================
           FORMULARIO
           ================================================= -->

      <form
        (ngSubmit)="registrar()"
        #registroForm="ngForm"
      >

        <div class="form-grid">


          <!-- TIPO DOCUMENTO -->
          <div class="campo">

            <label for="tipo_documento">
              Tipo de documento
            </label>

            <div class="input-container">

              <span class="input-icon">
                *
              </span>

              <select
                id="tipo_documento"
                name="tipo_documento"
                [(ngModel)]="usuario.tipo_documento"
                required
              >

                <option value="">
                  Selecciona una opción
                </option>

                <option value="CC">
                  Cédula de ciudadanía
                </option>

                <option value="TI">
                  Tarjeta de identidad
                </option>

                <option value="CE">
                  Cédula de extranjería
                </option>

              </select>

            </div>

          </div>


          <!-- NÚMERO DOCUMENTO -->
          <div class="campo">

            <label for="numero_documento">
              Número de documento
            </label>

            <div class="input-container">

              <span class="input-icon">
                #
              </span>

              <input
                type="text"
                id="numero_documento"
                name="numero_documento"
                [(ngModel)]="usuario.numero_documento"
                placeholder="Número de documento"
                required
              >

            </div>

          </div>


          <!-- NOMBRES -->
          <div class="campo">

            <label for="nombres">
              Nombres
            </label>

            <div class="input-container">

              <span class="input-icon">
                *
              </span>

              <input
                type="text"
                id="nombres"
                name="nombres"
                [(ngModel)]="usuario.nombres"
                placeholder="Ingresa tus nombres"
                required
              >

            </div>

          </div>


          <!-- APELLIDOS -->
          <div class="campo">

            <label for="apellidos">
              Apellidos
            </label>

            <div class="input-container">

              <span class="input-icon">
                *
              </span>

              <input
                type="text"
                id="apellidos"
                name="apellidos"
                [(ngModel)]="usuario.apellidos"
                placeholder="Ingresa tus apellidos"
                required
              >

            </div>

          </div>


          <!-- TELÉFONO -->
          <div class="campo">

            <label for="telefono">
              Teléfono
            </label>

            <div class="input-container">

              <span class="input-icon">
                *
              </span>

              <input
                type="text"
                id="telefono"
                name="telefono"
                [(ngModel)]="usuario.telefono"
                placeholder="300 000 0000"
              >

            </div>

          </div>


          <!-- CORREO -->
          <div class="campo">

            <label for="correo">
              Correo electrónico
            </label>

            <div class="input-container">

              <span class="input-icon">
                ✉
              </span>

              <input
                type="email"
                id="correo"
                name="correo"
                [(ngModel)]="usuario.correo"
                placeholder="correo@ejemplo.com"
                required
              >

            </div>

          </div>


          <!-- CONTRASEÑA -->
          <div class="campo campo-completo">

            <label for="contrasena">
              Contraseña
            </label>

            <div class="input-container">

              <span class="input-icon">
                *
              </span>

              <input
                type="password"
                id="contrasena"
                name="contrasena"
                [(ngModel)]="usuario.contrasena"
                placeholder="Crea una contraseña"
                required
              >

              <span class="password-icon">
                *
              </span>

            </div>

          </div>

        </div>


        <!-- =================================================
             MENSAJES
             ================================================= -->

        <div
          class="mensaje-exito"
          *ngIf="mensaje"
        >
          {{ mensaje }}
        </div>


        <div
          class="mensaje-error"
          *ngIf="error"
        >
          {{ error }}
        </div>


        <!-- =================================================
             BOTÓN
             ================================================= -->

        <button
          type="submit"
          class="btn-registro"
          [disabled]="cargando"
        >
          {{ cargando ? 'Registrando...' : 'Registrarse' }}
        </button>

      </form>


      <!-- =================================================
           LOGIN
           ================================================= -->

      <p class="login-link">

        ¿Ya tienes una cuenta?

        <button
          type="button"
          (click)="login()"
        >
          Inicia sesión
        </button>

      </p>

    </div>

  </div>

</div>
