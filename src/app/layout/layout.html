<div class="layout-container">

  <!-- =====================================================
       BARRA LATERAL
       ===================================================== -->
  <aside class="layout-sidebar">

    <!-- LOGOTIPO -->
    <div class="layout-logo-container">
      <div class="layout-logo">
        <span class="material-symbols-outlined">
          health_and_safety
        </span>
      </div>
    </div>


    <!-- MENÚ PRINCIPAL -->
    <nav class="layout-menu">

      <a
        *ngFor="let item of menu"
        [routerLink]="item.ruta"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="layout-menu-button"
        [attr.title]="item.nombre"
      >
        <span class="material-symbols-outlined">
          {{ item.icono }}
        </span>

        <span class="layout-menu-tooltip">
          {{ item.nombre }}
        </span>
      </a>

    </nav>


    <!-- MENÚ INFERIOR -->
    <div class="layout-sidebar-footer">

      <!-- CONFIGURACIÓN -->
      <a
        [routerLink]="configuracion.ruta"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="layout-menu-button"
        [attr.title]="configuracion.nombre"
      >
        <span class="material-symbols-outlined">
          {{ configuracion.icono }}
        </span>

        <span class="layout-menu-tooltip">
          {{ configuracion.nombre }}
        </span>
      </a>


      <!-- CERRAR SESIÓN -->
      <button
        type="button"
        class="layout-menu-button layout-logout-button"
        [attr.title]="textoCerrarSesion"
        (click)="cerrarSesion()"
      >
        <span class="material-symbols-outlined">
          logout
        </span>

        <span class="layout-menu-tooltip">
          {{ textoCerrarSesion }}
        </span>
      </button>

    </div>

  </aside>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->
  <div class="layout-main-container">

    <!-- ENCABEZADO -->
    <header class="layout-header">

      <!-- PARTE IZQUIERDA -->
      <div class="layout-header-left">

        <h1>
          {{ nombreAplicacion }}
        </h1>


        <!-- BUSCADOR -->
        <div class="layout-search-container">

          <span class="material-symbols-outlined layout-search-icon">
            search
          </span>

          <input
            type="text"
            [placeholder]="placeholderBuscador"
          >

        </div>

      </div>


      <!-- PARTE DERECHA -->
      <div class="layout-header-right">

        <!-- NOTIFICACIONES -->
        <button
          type="button"
          class="layout-header-button"
          title="Notificaciones"
          routerLink="/notificaciones"
        >
          <span class="material-symbols-outlined">
            notifications
          </span>

          <span class="layout-notification-dot"></span>
        </button>


        <!-- DIVISOR -->
        <div class="layout-header-divider"></div>


        <!-- USUARIO -->
        <div class="layout-user">

          <div class="layout-user-info">

            <strong>
              {{ nombreUsuario }}
            </strong>

            <span>
              {{ rolUsuario }}
            </span>

          </div>

          <div class="layout-avatar">
            {{ inicialesUsuario }}
          </div>

        </div>

      </div>

    </header>


    <!-- =====================================================
         CONTENIDO DE LAS PÁGINAS
         ===================================================== -->
    <main class="layout-content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
