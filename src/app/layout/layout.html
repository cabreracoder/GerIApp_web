<div class="layout-container">

  <!-- =====================================================
       BARRA LATERAL
       ===================================================== -->
  <aside class="layout-sidebar">



  
<!-- LOGOTIPO -->
<div class="layout-logo-container">
  <div class="layout-logo">
    <img
      src="/Logo-GerIApp.png"
      alt="GerIApp"
      class="layout-logo-image"
    >
  </div>
</div>


    <!-- MENÚ PRINCIPAL -->
    <nav class="layout-menu">

  <ng-container *ngFor="let item of menu">

    <!-- OPCIONES NORMALES -->
    <a
      *ngIf="item.nombre !== 'Pacientes'"
      [routerLink]="item.ruta"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="layout-menu-button"
      [attr.title]="item.nombre"
    >
      <span class="material-symbols-outlined">
        {{ item.icono }}
      </span>
    </a>


    <!-- PACIENTES -->
    <div
      *ngIf="item.nombre === 'Pacientes'"
      class="layout-pacientes-container"
    >

      <button
        type="button"
        class="layout-menu-button"
        title="Pacientes"
        (click)="togglePacientesMenu()"
      >
        <span class="material-symbols-outlined">
          {{ item.icono }}
        </span>
      </button>


      <!-- MENÚ FLOTANTE -->
      <div
        *ngIf="pacientesMenuAbierto"
        class="layout-pacientes-menu"
      >

        <a
          routerLink="/pacientes"
          class="layout-pacientes-option"
          (click)="cerrarPacientesMenu()"
        >
          Gestión de pacientes
        </a>

        <a
            routerLink="/elementos-paciente"
            class="layout-pacientes-option"
            (click)="cerrarPacientesMenu()"
    >
            Elementos del paciente
        </a>

      </div>

    </div>

  </ng-container>

</nav>


    <!-- MENÚ INFERIOR -->
    <div class="layout-sidebar-footer">


      <!-- CERRAR SESIÓN -->
      <button
        type="button"
        class="layout-menu-button layout-logout-button"
        [attr.title]="textoCerrarSesion"
        (click)="cerrarSesion()"
      >
        <span class="material-symbols-outlined">
          logout
        </span>

        <span class="layout-menu-tooltip">
          {{ textoCerrarSesion }}
        </span>
      </button>

    </div>

  </aside>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->
  <div class="layout-main-container">

    <!-- ENCABEZADO -->
    <header class="layout-header">

      <!-- PARTE IZQUIERDA -->
      <div class="layout-header-left">

        <h1>
          {{ nombreAplicacion }}
        </h1>

      </div>


      <!-- PARTE DERECHA -->
      <div class="layout-header-right">

        <!-- NOTIFICACIONES -->
        <button
          type="button"
          class="layout-header-button"
          title="Notificaciones"
          routerLink="/notificaciones"
        >
          <span class="material-symbols-outlined">
            notifications
          </span>

          <span class="layout-notification-dot"></span>
        </button>


        <!-- DIVISOR -->
        <div class="layout-header-divider"></div>


        <!-- USUARIO -->
        <div class="layout-user">

          <div class="layout-user-info">

            <strong>
              {{ nombreUsuario }}
            </strong>

            <span>
              {{ rolUsuario }}
            </span>

          </div>

          <button
                type="button"
                class="layout-avatar"
                title="Ver perfil"
                (click)="abrirConfiguracion()"
              > 
                {{ inicialesUsuario }}
          </button>

        </div>

      </div>

    </header>


    <!-- =====================================================
         CONTENIDO DE LAS PÁGINAS
         ===================================================== -->
    <main class="layout-content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
