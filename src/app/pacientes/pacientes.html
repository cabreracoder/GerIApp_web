<div class="p-8">

    <!-- ENCABEZADO -->
    <div class="flex justify-between items-center mb-8">

        <div>
            <h1 class="text-3xl font-bold text-[#212529]">
                Gestión de Pacientes
            </h1>

            <p class="text-[#6C757D] mt-1">
                Administración y registro de pacientes
            </p>
        </div>

        <button
            type="button"
            class="px-5 py-3 rounded-lg
                   border border-[#3B5BDB]
                   bg-[#3B5BDB] text-white
                   hover:bg-[#324EC7] transition"
        >
            + Nuevo Paciente
        </button>

    </div>


    <!-- CANTIDAD DE PACIENTES -->
    <div class="mb-5">

        <p class="text-sm text-[#6C757D]">
            Pacientes registrados:

            <span class="font-semibold text-[#212529]">
                {{ filteredPatients.length }}
            </span>
        </p>

    </div>


    <!-- TABLA -->
    <div class="overflow-x-auto">

        <table class="w-full border-separate border-spacing-y-2">

            <!-- ENCABEZADO -->
            <thead>

                <tr class="bg-[#3B5BDB]">

                    <th class="px-5 py-4 text-left text-sm font-semibold !text-white rounded-l-lg">
                        Paciente
                    </th>

                    <th class="px-5 py-4 text-left text-sm font-semibold !text-white">
                        Documento
                    </th>

                    <th class="px-5 py-4 text-left text-sm font-semibold !text-white">
                        Edad
                    </th>

                    <th class="px-5 py-4 text-left text-sm font-semibold !text-white">
                        EPS
                    </th>

                    <th class="px-5 py-4 text-left text-sm font-semibold !text-white">
                        Fecha de ingreso
                    </th>

                    <th class="px-5 py-4 text-left text-sm font-semibold !text-white">
                        Estado
                    </th>

                    <th class="px-5 py-4 text-center text-sm font-semibold !text-white rounded-r-lg">
                        Acciones
                    </th>

                </tr>

            </thead>


            <!-- CUERPO -->
            <tbody>

                <!-- SIN PACIENTES -->
                <tr *ngIf="filteredPatients.length === 0">

                    <td
                        colspan="7"
                        class="px-5 py-12 text-center text-[#6C757D]"
                    >
                        No se encontraron pacientes.
                    </td>

                </tr>


                <!-- PACIENTES -->
                <tr
                    *ngFor="let patient of filteredPatients"
                    class="bg-[#F4F7FF]"
                >

                    <!-- NOMBRE -->
                    <td class="px-5 py-4 rounded-l-lg">

                        <div
                            class="inline-flex items-center
                                   px-4 py-2
                                   bg-white
                                   border border-[#D9E0F2]
                                   rounded-lg
                                   text-[#212529]
                                   font-medium"
                        >
                            {{ patient.name }}
                        </div>

                    </td>


                    <!-- DOCUMENTO -->
                    <td class="px-5 py-4 text-sm text-[#495057]">
                        {{ patient.doc }}
                    </td>


                    <!-- EDAD -->
                    <td class="px-5 py-4 text-sm text-[#495057]">
                        {{ patient.age }} años
                    </td>


                    <!-- EPS -->
                    <td class="px-5 py-4 text-sm text-[#495057]">
                        -
                    </td>


                    <!-- FECHA DE INGRESO -->
                    <td class="px-5 py-4 text-sm text-[#495057]">
                        -
                    </td>


                    <!-- ESTADO -->
                    <td class="px-5 py-4">

                        <span
                            class="inline-flex items-center
                                   px-3 py-1
                                   bg-white
                                   border border-[#D9E0F2]
                                   rounded-lg
                                   text-sm text-[#495057]"
                        >
                            {{ patient.status }}
                        </span>

                    </td>


                    <!-- ACCIONES -->
                    <td class="px-5 py-4 rounded-r-lg">

                        <div class="flex justify-center gap-2">

                            <!-- VER -->
                            <button
                                type="button"
                                class="px-3 py-2
                                       rounded-lg
                                       border border-[#D9E0F2]
                                       bg-white
                                       text-[#3B5BDB]
                                       text-sm
                                       hover:bg-[#F4F7FF]"
                            >
                                Ver
                            </button>


                            <!-- EDITAR -->
                            <button
                                type="button"
                                class="px-3 py-2
                                       rounded-lg
                                       border border-[#D9E0F2]
                                       bg-white
                                       text-[#3B5BDB]
                                       text-sm
                                       hover:bg-[#F4F7FF]"
                            >
                                Editar
                            </button>


                            <!-- ELIMINAR -->
                            <button
                                type="button"
                                class="px-3 py-2
                                       rounded-lg
                                       border border-[#D9E0F2]
                                       bg-white
                                       text-[#DC3545]
                                       text-sm
                                       hover:bg-[#FFF5F5]"
                            >
                                Eliminar
                            </button>

                        </div>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
