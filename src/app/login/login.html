<div class="login-container">

  <!-- PANEL IZQUIERDO - IDENTIDAD GER IAPP -->
  <div class="branding-panel">

    <div class="branding-content">

      <!-- Logo -->
      <div class="logo-gerIapp">

        <img
          src="/loginLogo.png"
          alt="GerIApp"
          class="logo-gerIapp-img"
        >

        <h2>GerIApp</h2>

      </div>

      <div class="linea-decorativa"></div>

      <div class="branding-text">
        <h3>Cuidados que conectan</h3>

        <p>
          Una plataforma para el bienestar
          y cuidado de nuestros adultos mayores.
        </p>
      </div>

    </div>

  </div>


  <!-- PANEL DERECHO - LOGIN -->
  <div class="login-panel">

    <div class="login-card">

      <!-- Encabezado -->
      <div class="login-header">

        <h1>Bienvenido de nuevo</h1>

        <p class="subtitulo">
          Inicia sesión para continuar
        </p>

      </div>


      <!-- FORMULARIO -->
      <form (ngSubmit)="iniciarSesion()">

        <!-- CORREO -->
        <div class="campo">

          <label for="correo">
            Correo electrónico
          </label>

          <div class="input-container">

            <span class="input-icon">✉</span>

            <input
              type="email"
              id="correo"
              name="correo"
              [(ngModel)]="usuario.correo"
              placeholder="correo@ejemplo.com"
              required
            >

          </div>

        </div>


        <!-- CONTRASEÑA -->
        <div class="campo">

          <label for="contrasena">
            Contraseña
          </label>

          <div class="input-container">

            <span class="input-icon"> *</span>

            <input
              type="password"
              id="contrasena"
              name="contrasena"
              [(ngModel)]="usuario.contrasena"
              placeholder="Ingresa tu contraseña"
              required
            >

            <span class="password-icon">
              *
            </span>

          </div>

        </div>


        <!-- RECUPERAR CONTRASEÑA -->
        <div class="recuperar-container">

          <button
            type="button"
            class="recuperar-btn"
          >
            ¿Olvidaste tu contraseña?
          </button>

        </div>


        <!-- MENSAJE DE ÉXITO -->
        <div
          class="mensaje-exito"
          *ngIf="mensaje"
        >
          {{ mensaje }}
        </div>


        <!-- MENSAJE DE ERROR -->
        <div
          class="mensaje-error"
          *ngIf="error"
        >
          {{ error }}
        </div>


        <!-- BOTÓN LOGIN -->
        <button
          type="submit"
          class="btn-login"
          [disabled]="cargando"
        >

          {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}

        </button>

      </form>


      <!-- SEPARADOR -->
      <div class="separador">

        <span></span>

        <p>o</p>

        <span></span>

      </div>


      <!-- GOOGLE -->
      <button
        type="button"
        class="btn-google"
      >

        <span class="google-icon">G</span>

        <span>Continuar con Google</span>

      </button>


      <!-- REGISTRO -->
      <p class="registro-link">

        ¿No tienes una cuenta?

        <button
          type="button"
          (click)="registro()"
        >
          Crear cuenta
        </button>

      </p>

    </div>

  </div>

</div>
