<main class="pagina">

  <!-- =====================================================
       CABECERA
  ====================================================== -->

  <header class="encabezado-configuracion">

    <div class="contenido-encabezado-configuracion">

      <h1 class="titulo-configuracion">
        Perfil
      </h1>

      <p class="subtitulo-configuracion">
        Congigure su perfil y cambie su contraseña para mantener su cuenta segura.
      </p>

    </div>

  </header>


  <!-- =====================================================
       PERFIL DE ADMINISTRADOR
  ====================================================== -->

  <section class="tarjeta-configuracion">

    <!-- TÍTULO -->

    <div class="titulo-seccion-configuracion">

      <span class="material-symbols-outlined">
        manage_accounts
      </span>

      <h3>
        Perfil de Administrador
      </h3>

    </div>


    <!-- ===================================================
         INFORMACIÓN DEL PERFIL
    ==================================================== -->

    <div class="fila-perfil-configuracion">

      <!-- AVATAR -->

      <div class="avatar-administrador">
        {{ inicialesUsuario }}
      </div>


      <!-- INFORMACIÓN -->

      <div class="informacion-perfil">

        <div class="nombre-perfil">
          {{ nombreUsuario }}
        </div>

        <div class="datos-perfil">
          {{ cargoUsuario }} · {{ correoUsuario }}
        </div>

      </div>


      <!-- CAMBIAR FOTO -->

      <button
        type="button"
        class="boton-secundario-configuracion"
        (click)="cambiarFoto()">

        Cambiar foto

      </button>

    </div>


    <!-- ===================================================
         CAMPOS DEL PERFIL
    ==================================================== -->

    <div class="cuadricula-formulario-configuracion">


      <!-- NOMBRE COMPLETO -->

      <div class="campo-formulario-configuracion">

        <label for="configuracionNombre">
          Nombre Completo
        </label>

        <input
          id="configuracionNombre"
          type="text"
          [(ngModel)]="nombreUsuario"
          autocomplete="name">

      </div>


      <!-- CORREO -->

      <div class="campo-formulario-configuracion">

        <label for="configuracionEmail">
          Correo Electrónico
        </label>

        <input
          id="configuracionEmail"
          type="email"
          [(ngModel)]="correoUsuario"
          autocomplete="email">

      </div>


      <!-- TELÉFONO -->

      <div class="campo-formulario-configuracion">

        <label for="configuracionTelefono">
          Teléfono
        </label>

        <input
          id="configuracionTelefono"
          type="tel"
          [(ngModel)]="telefonoUsuario"
          autocomplete="tel">

      </div>


      <!-- CARGO -->

      <div class="campo-formulario-configuracion">

        <label for="configuracionCargo">
          Cargo
        </label>

        <input
          id="configuracionCargo"
          type="text"
          [(ngModel)]="cargoUsuario"
          readonly>

      </div>

    </div>


    <!-- ===================================================
         FOOTER DEL PERFIL
    ==================================================== -->

    <div class="pie-tarjeta-configuracion">


      <!-- MENSAJE DE ÉXITO -->

      <div
        class="mensaje-exito-configuracion"
        *ngIf="mensajeExito">

        <span class="material-symbols-outlined">
          check_circle
        </span>

        {{ mensajeExito }}

      </div>


      <!-- MENSAJE DE ERROR -->

      <div
        class="mensaje-error-configuracion"
        *ngIf="mensajeError">

        <span class="material-symbols-outlined">
          error
        </span>

        {{ mensajeError }}

      </div>


      <!-- BOTÓN GUARDAR -->

      <button
        type="button"
        class="boton-principal-configuracion"
        (click)="guardarCambios()"
        [disabled]="guardando">


        <!-- INDICADOR DE CARGA -->

        <span
          class="indicador-carga-configuracion"
          *ngIf="guardando">
        </span>


        <!-- TEXTO -->

        <span class="texto-boton-configuracion">

          {{ guardando
            ? 'Guardando...'
            : 'Guardar cambios'
          }}

        </span>

      </button>

    </div>

  </section>


  <!-- =====================================================
       SEGURIDAD
  ====================================================== -->

  <section class="tarjeta-configuracion">

    <!-- TÍTULO -->

    <div class="titulo-seccion-configuracion">

      <span class="material-symbols-outlined">
        lock
      </span>

      <h3>
        Seguridad
      </h3>

    </div>


    <!-- ===================================================
         CAMPOS DE SEGURIDAD
    ==================================================== -->

    <div class="cuadricula-seguridad-configuracion">


      <!-- CONTRASEÑA ACTUAL -->

      <div class="campo-formulario-configuracion">

        <label for="configuracionPasswordActual">
          Contraseña actual
        </label>

        <input
          id="configuracionPasswordActual"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="contrasenaActual"
          autocomplete="current-password">

      </div>


      <!-- ESPACIO -->

      <div class="campo-formulario-vacio"></div>


      <!-- NUEVA CONTRASEÑA -->

      <div class="campo-formulario-configuracion">

        <label for="configuracionPasswordNueva">
          Nueva contraseña
        </label>

        <input
          id="configuracionPasswordNueva"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="nuevaContrasena"
          autocomplete="new-password">

      </div>


      <!-- CONFIRMAR CONTRASEÑA -->

      <div class="campo-formulario-configuracion">

        <label for="configuracionPasswordConfirmar">
          Confirmar contraseña
        </label>

        <input
          id="configuracionPasswordConfirmar"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="confirmarContrasena"
          autocomplete="new-password">

      </div>

    </div>


    <!-- ===================================================
         FOOTER SEGURIDAD
    ==================================================== -->

    <div class="pie-seguridad-configuracion">

      <button
        type="button"
        class="boton-outline-configuracion"
        (click)="actualizarContrasena()">

        Actualizar contraseña

      </button>

    </div>

  </section>

</main>
