<main class="pagina">

  <!-- =====================================================
       CABECERA
  ====================================================== -->
  <header class="encabezado-configuracion">
    <div class="contenido-encabezado-configuracion">

      <h1 class="titulo-configuracion">
        Perfil
      </h1>

      <p class="subtitulo-configuracion">
        Configure su perfil y cambie su contraseña para mantener su cuenta segura.
      </p>

    </div>
  </header>


  <!-- =====================================================
       PERFIL DE ADMINISTRADOR
  ====================================================== -->
  <section class="tarjeta-configuracion">

    <div class="titulo-seccion-configuracion">

      <span class="material-symbols-outlined">
        manage_accounts
      </span>

      <h3>
        Perfil de Administrador
      </h3>

    </div>


    <!-- ===================================================
         INFORMACIÓN DEL PERFIL
    ==================================================== -->
    <div class="fila-perfil-configuracion">

      <!-- AVATAR -->
      <div class="avatar-administrador">

        <!-- Mostrar foto cuando existe -->
        <img
          *ngIf="fotoUsuario"
          [src]="fotoUsuario"
          alt="Foto de perfil">

        <!-- Mostrar iniciales cuando no existe foto -->
        <span *ngIf="!fotoUsuario">
          {{ inicialesUsuario }}
        </span>

      </div>


      <!-- INFORMACIÓN -->
      <div class="informacion-perfil">

        <div class="nombre-perfil">
          {{ nombreUsuario }}
        </div>

        <div class="datos-perfil">
          {{ cargoUsuario }} · {{ correoUsuario }}
        </div>

      </div>


      <!-- INPUT OCULTO PARA SELECCIONAR FOTO -->
      <input
        #selectorFoto
        type="file"
        accept="image/jpeg,image/png,image/webp"
        hidden
        (change)="seleccionarFoto($event)">


      <!-- BOTÓN CAMBIAR FOTO -->
      <button
        type="button"
        class="boton-secundario-configuracion"
        (click)="cambiarFoto(selectorFoto)">

        Cambiar foto

      </button>

    </div>


    <!-- ===================================================
         CAMPOS DEL PERFIL
    ==================================================== -->
    <div class="cuadricula-formulario-configuracion">


      <!-- NOMBRE -->
      <div class="campo-formulario-configuracion">

        <label for="configuracionNombre">

          Nombre Completo

          <span class="asterisco-obligatorio">
            *
          </span>

        </label>

        <input
          id="configuracionNombre"
          type="text"
          [(ngModel)]="nombreUsuarioEdicion"
          autocomplete="name"
          required>

      </div>


      <!-- CORREO -->
      <div class="campo-formulario-configuracion">

        <label for="configuracionEmail">

          Correo Electrónico

          <span class="asterisco-obligatorio">
            *
          </span>

        </label>

        <input
          id="configuracionEmail"
          type="email"
          [(ngModel)]="correoUsuario"
          autocomplete="email"
          required>

      </div>


      <!-- TELÉFONO -->
      <div class="campo-formulario-configuracion">

        <label for="configuracionTelefono">

          Teléfono

          <span class="asterisco-obligatorio">
            *
          </span>

        </label>

        <input
          id="configuracionTelefono"
          type="tel"
          [(ngModel)]="telefonoUsuario"
          autocomplete="tel"
          required>

      </div>


      <!-- CARGO -->
      <div class="campo-formulario-configuracion">

        <label for="configuracionCargo">
          Cargo
        </label>

        <input
          id="configuracionCargo"
          type="text"
          [(ngModel)]="cargoUsuario"
          readonly>

      </div>

    </div>


    <!-- ===================================================
         FOOTER DEL PERFIL
    ==================================================== -->
    <div class="pie-tarjeta-configuracion">

      <button
        type="button"
        class="boton-principal-configuracion"
        (click)="guardarCambios()"
        [disabled]="guardando">

        <span
          class="indicador-carga-configuracion"
          *ngIf="guardando">
        </span>

        <span class="texto-boton-configuracion">
          {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
        </span>

      </button>

    </div>

  </section>


  <!-- =====================================================
       SEGURIDAD
  ====================================================== -->
  <section class="tarjeta-configuracion">

    <div class="titulo-seccion-configuracion">

      <span class="material-symbols-outlined">
        lock
      </span>

      <h3>
        Seguridad
      </h3>

    </div>


    <!-- ===================================================
         CAMPOS DE SEGURIDAD
    ==================================================== -->
    <div class="cuadricula-seguridad-configuracion">


      <!-- CONTRASEÑA ACTUAL -->
      <div class="campo-formulario-configuracion">

        <label for="configuracionPasswordActual">
          Contraseña actual
        </label>

        <input
          id="configuracionPasswordActual"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="contrasenaActual"
          autocomplete="current-password">

      </div>


      <div class="campo-formulario-vacio"></div>


      <!-- NUEVA CONTRASEÑA -->
      <div class="campo-formulario-configuracion">

        <label for="configuracionPasswordNueva">

          Nueva contraseña

          <span class="asterisco-obligatorio">
            *
          </span>

        </label>

        <input
          id="configuracionPasswordNueva"
          type="password"
          placeholder="8 a 10 caracteres"
          [(ngModel)]="nuevaContrasena"
          autocomplete="new-password"
          minlength="8"
          maxlength="10">

      </div>


      <!-- CONFIRMAR CONTRASEÑA -->
      <div class="campo-formulario-configuracion">

        <label for="configuracionPasswordConfirmar">

          Confirmar contraseña

          <span class="asterisco-obligatorio">
            *
          </span>

        </label>

        <input
          id="configuracionPasswordConfirmar"
          type="password"
          placeholder="8 a 10 caracteres"
          [(ngModel)]="confirmarContrasena"
          autocomplete="new-password"
          minlength="8"
          maxlength="10">

      </div>

    </div>


    <!-- ===================================================
         FOOTER SEGURIDAD
    ==================================================== -->
    <div class="pie-seguridad-configuracion">

      <button
        type="button"
        class="boton-outline-configuracion"
        (click)="actualizarContrasena()">

        Actualizar contraseña

      </button>

    </div>

  </section>

</main>
